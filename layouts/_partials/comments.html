<div class="comments">
  <script>
    // Load giscus with the page's current theme (not the system one), so they always match.
    (function () {
      const s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.async = true;
      s.crossOrigin = 'anonymous';
      const attrs = {
        'repo': 'wiloon/blog',
        'repo-id': 'MDEwOlJlcG9zaXRvcnkyNjI4MDM4MDg=',
        'category': 'Announcements',
        'category-id': 'DIC_kwDOD6oRYM4C-yry',
        'mapping': 'pathname',
        'strict': '1',
        'reactions-enabled': '1',
        'emit-metadata': '0',
        'input-position': 'bottom',
        'theme': document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light',
        'lang': 'zh-CN'
      };
      for (const k in attrs) s.setAttribute('data-' + k, attrs[k]);
      document.currentScript.parentNode.appendChild(s);
    })();
  </script>
</div>
